{% extends "base.html" %}

{% block title %}GENZ GADGETS | Login{% endblock %}

{% block auth_content %}
<div class="form-card" style="margin: 15vh auto 0 auto; box-shadow: var(--shadow-lg);">
    <h2 class="form-title" style="margin-bottom: 0.25rem;"><span class="logo-accent" style="font-weight: 800;">GENZ</span> GADGETS</h2>
    <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem; font-weight: 600;">Inventory Management System</p>
    <form action="{{ url_for('login') }}" method="POST" id="login-form">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; border-radius: var(--radius-full);">
            Authenticate <i class="bi bi-chevron-right"></i>
        </button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('login-form');
        if (!form) return;

        form.addEventListener('submit', function () {
            var usernameInput = document.getElementById('username');
            var passwordInput = document.getElementById('password');
            if (!usernameInput || !passwordInput) return;

            if (usernameInput.value.trim() && passwordInput.value) {
                localStorage.setItem('showLoginSuccess', '1');
            }
        });
    });
</script>
{% endblock %}
